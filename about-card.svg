<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e1524" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="aboutBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363D" />
      <stop offset="50%" stop-color="#00FF66" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#30363D" />
    </linearGradient>
  </defs>

  <style>
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .term-prompt { fill: #00FF66; font-size: 13px; font-weight: bold; }
    .term-cmd { fill: #79C0FF; font-size: 13px; font-weight: bold; }
    .json-bracket { fill: #D2A8FF; font-size: 12.5px; font-weight: bold; }
    .json-key { fill: #58A6FF; font-size: 12px; font-weight: 600; }
    .json-colon { fill: #8B949E; font-size: 12px; }
    .json-str { fill: #A5D6FF; font-size: 12px; }
    .json-str-accent { fill: #7EE787; font-size: 12px; font-weight: 600; }
    .json-str-gold { fill: #FFA657; font-size: 12px; font-weight: 600; }
    .json-comment { fill: #8B949E; font-size: 11.5px; font-style: italic; }
    .cursor { animation: cursorBlink 1s infinite steps(1); fill: #00FF66; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="876" height="316" rx="14" fill="url(#aboutBg)" stroke="url(#aboutBorderGrad)" stroke-width="1.5" />

  <!-- Window Header -->
  <circle cx="26" cy="22" r="5" fill="#FF5F56" />
  <circle cx="44" cy="22" r="5" fill="#FFBD2E" />
  <circle cx="62" cy="22" r="5" fill="#27C93F" />
  <text x="82" y="26" class="font-mono" fill="#8B949E" font-size="12px">bash — cat ~/developer-spec.json</text>

  <!-- Command Line -->
  <g transform="translate(26, 52)" class="font-mono">
    <text x="0" y="0" class="term-prompt">emanuel@cloud-box:~$ <tspan class="term-cmd">cat profile.json</tspan></text>
  </g>

  <!-- JSON Code Block -->
  <g transform="translate(26, 74)" class="font-mono">
    <!-- Line 1: { -->
    <text x="0" y="0" class="json-bracket">{</text>

    <!-- Line 2: "developer" -->
    <text x="20" y="18">
      <tspan class="json-key">"developer"</tspan><tspan class="json-colon">: </tspan><tspan class="json-str-accent">"Emanuel Cabrera"</tspan><tspan class="json-colon">,</tspan>
      <tspan class="json-comment"> // emanuelca109</tspan>
    </text>

    <!-- Line 3: "rol" -->
    <text x="20" y="36">
      <tspan class="json-key">"rol"</tspan><tspan class="json-colon">: </tspan><tspan class="json-str">"Full-Stack Developer &amp; Software Engineer"</tspan><tspan class="json-colon">,</tspan>
    </text>

    <!-- Line 4: "pais" -->
    <text x="20" y="54">
      <tspan class="json-key">"pais"</tspan><tspan class="json-colon">: </tspan><tspan class="json-str">"Colombia 🇨🇴"</tspan><tspan class="json-colon">,</tspan>
      <tspan class="json-key"> "disponibilidad"</tspan><tspan class="json-colon">: </tspan><tspan class="json-str-accent">"Full-Time / Freelance"</tspan><tspan class="json-colon">,</tspan>
    </text>

    <!-- Line 5: "stack_backend" -->
    <text x="20" y="72">
      <tspan class="json-key">"stack_backend"</tspan><tspan class="json-colon">: [</tspan><tspan class="json-str-gold">"Laravel"</tspan><tspan class="json-colon">, </tspan><tspan class="json-str-gold">"PHP"</tspan><tspan class="json-colon">, </tspan><tspan class="json-str">"Python"</tspan><tspan class="json-colon">, </tspan><tspan class="json-str">"MySQL"</tspan><tspan class="json-colon">, </tspan><tspan class="json-str">"REST APIs"</tspan><tspan class="json-colon">],</tspan>
    </text>

    <!-- Line 6: "stack_frontend" -->
    <text x="20" y="90">
      <tspan class="json-key">"stack_frontend"</tspan><tspan class="json-colon">: [</tspan><tspan class="json-str-accent">"JavaScript"</tspan><tspan class="json-colon">, </tspan><tspan class="json-str-accent">"TailwindCSS"</tspan><tspan class="json-colon">, </tspan><tspan class="json-str">"Bootstrap"</tspan><tspan class="json-colon">, </tspan><tspan class="json-str">"HTML5/CSS3"</tspan><tspan class="json-colon">],</tspan>
    </text>

    <!-- Line 7: "entorno_y_devops" -->
    <text x="20" y="108">
      <tspan class="json-key">"herramientas"</tspan><tspan class="json-colon">: [</tspan><tspan class="json-str">"Git"</tspan><tspan class="json-colon">, </tspan><tspan class="json-str">"GitHub"</tspan><tspan class="json-colon">, </tspan><tspan class="json-str">"Linux"</tspan><tspan class="json-colon">, </tspan><tspan class="json-str">"VS Code"</tspan><tspan class="json-colon">, </tspan><tspan class="json-str">"Postman"</tspan><tspan class="json-colon">],</tspan>
    </text>

    <!-- Line 8: "proyectos_clave" -->
    <text x="20" y="126">
      <tspan class="json-key">"proyectos_clave"</tspan><tspan class="json-colon">: [</tspan><tspan class="json-str-accent">"Coffee.Dat (E-Commerce)"</tspan><tspan class="json-colon">, </tspan><tspan class="json-str">"Sistema de Inventario"</tspan><tspan class="json-colon">, </tspan><tspan class="json-str">"Sistema Calificaciones"</tspan><tspan class="json-colon">],</tspan>
    </text>

    <!-- Line 9: "filosofia" -->
    <text x="20" y="144">
      <tspan class="json-key">"filosofia"</tspan><tspan class="json-colon">: </tspan><tspan class="json-str">"Código limpio, modularidad, rendimiento y soluciones escalables"</tspan><tspan class="json-colon">,</tspan>
    </text>

    <!-- Line 10: "contacto" -->
    <text x="20" y="162">
      <tspan class="json-key">"contacto"</tspan><tspan class="json-colon">: </tspan><tspan class="json-str">"emasan1999@gmail.com"</tspan>
    </text>

    <!-- Line 11: } -->
    <text x="0" y="180" class="json-bracket">}</text>
  </g>

  <!-- Prompt bottom -->
  <g transform="translate(26, 285)" class="font-mono">
    <text x="0" y="0" class="term-prompt">emanuel@cloud-box:~$ <tspan fill="#8B949E">echo "Listo para colaborar en proyectos de alto nivel"</tspan><tspan class="cursor"> █</tspan></text>
  </g>
</svg>
