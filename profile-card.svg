  <g transform="translate(25, 415)">
    <text x="0" y="0" class="prompt">┌──(emanuelca109@github)-[~]</text>
    <text x="0" y="22" class="prompt">└─$ <tspan fill="#E6EDF3">Construyendo soluciones web y arquitectura sólida...</tspan></text>
