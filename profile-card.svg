      <text x="0" y="200"><tspan class="key">Contacto.Correo:</tspan> <tspan class="val">emasan1999@gmail.com</tspan></text>
      <text x="0" y="220"><tspan class="key">GitHub.Status:</tspan> <tspan class="val-accent">🚀 Activo &amp; Desarrollando</tspan></text>
