<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF41" />
      <stop offset="70%" stop-color="#00FF41" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes neonGlow {
      0%, 100% { filter: drop-shadow(0 0 2px #00FF41); }
      50% { filter: drop-shadow(0 0 8px #00FF41) drop-shadow(0 0 15px rgba(0,255,65,0.4)); }
    }
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.15; }
      50% { opacity: 0.35; }
      100% { transform: translateY(480px); opacity: 0.15; }
    }
    @keyframes pulseDot {
      0%, 100% { r: 5.5; opacity: 1; }
      50% { r: 6.5; opacity: 0.7; }
    }

    .term-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13.5px; }
    .title-name { font-family: 'Fira Code', monospace; font-size: 19px; font-weight: bold; fill: #00FF41; animation: neonGlow 3s infinite ease-in-out; }
    .title-user { font-family: 'Fira Code', monospace; font-size: 13.5px; fill: #58A6FF; }
    .key { fill: #58A6FF; font-weight: 600; }
    .val { fill: #E6EDF3; }
    .val-accent { fill: #7EE787; }
    .ascii { fill: #388BFD; font-family: monospace; font-size: 11px; line-height: 1.1; }
    .prompt { fill: #00FF41; font-family: 'Fira Code', monospace; font-size: 13.5px; font-weight: bold; }
    .cursor-blink { animation: blink 1s infinite steps(1); fill: #00FF41; }
    .scan-bar { animation: scanline 6s linear infinite; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="876" height="496" rx="12" fill="url(#bgGrad)" stroke="#30363D" stroke-width="1.5" />

  <!-- Animated Scanline -->
  <line x1="10" y1="10" x2="870" y2="10" stroke="#00FF41" stroke-width="1.5" stroke-opacity="0.3" class="scan-bar" />

  <!-- Window Buttons with Pulse -->
  <circle cx="24" cy="22" r="5.5" fill="#FF5F56" />
  <circle cx="42" cy="22" r="5.5" fill="#FFBD2E" />
  <circle cx="60" cy="22" r="5.5" fill="#27C93F" />

  <!-- ASCII Art Left Side -->
  <g transform="translate(25, 75)">
    <text class="ascii" xml:space="preserve">
      <tspan x="0" y="14">#####################::::::::::#####################</tspan>
      <tspan x="0" y="26">##################+++::::..::::+++##################</tspan>
      <tspan x="0" y="38">###############+++:..............:+++###############</tspan>
      <tspan x="0" y="50">############++-.                    .-++############</tspan>
      <tspan x="0" y="62">###########:                            :###########</tspan>
      <tspan x="0" y="74">##########+                              +##########</tspan>
      <tspan x="0" y="86">#########+     :::::            :::::     +#########</tspan>
      <tspan x="0" y="98">#########.   :++:::++:        :++:::++:   .#########</tspan>
      <tspan x="0" y="110">########+:+  ..........      ..........  +:+########</tspan>
      <tspan x="0" y="122">########-    .::::::::.      .::::::::.    -########</tspan>
      <tspan x="0" y="134">########-    :++++++++.      .++++++++:    -########</tspan>
      <tspan x="0" y="146">#########.   .::::::..        ..::::::.   .#########</tspan>
      <tspan x="0" y="158">#########+   .:::::::..      ..:::::::.   +#########</tspan>
      <tspan x="0" y="170">##########.    .:::::::......:::::::.    .##########</tspan>
      <tspan x="0" y="182">###########.      ..::::::::::::..      .###########</tspan>
      <tspan x="0" y="194">############+:          ....          :+############</tspan>
      <tspan x="0" y="206">###############+::                ::+###############</tspan>
      <tspan x="0" y="218">##################++:.        .:++##################</tspan>
      <tspan x="0" y="230">#####################+: .##. :+#####################</tspan>
      <tspan x="0" y="242">######+-.             #####: :#####             .-+######</tspan>
      <tspan x="0" y="254">::.                  :####:   :####:                  .::</tspan>
      <tspan x="0" y="266">                      :##:     :##:                      </tspan>
      <tspan x="0" y="278">                     .###+     +###.                     </tspan>
    </text>
  </g>

  <!-- Right Side Terminal Content -->
  <g transform="translate(365, 45)">
    <!-- Header Title con Nombre Neón Animado -->
    <text x="0" y="0" class="title-name">ENMANUEL <tspan font-size="13px" fill="#7EE787" font-weight="normal">// FULL-STACK DEVELOPER</tspan></text>
    <text x="0" y="20" class="title-user">emanuelca109@github</text>
    <line x1="0" y1="28" x2="480" y2="28" stroke="url(#lineGrad)" stroke-width="1.5" />

    <!-- Details List -->
    <g transform="translate(0, 48)" class="term-text">
      <text x="0" y="0"><tspan class="key">Rol:</tspan> <tspan class="val">Desarrollador Full Stack / Software Engineer</tspan></text>
      <text x="0" y="20"><tspan class="key">Educacion:</tspan> <tspan class="val">Ingenieria de Software / Desarrollo Web</tspan></text>
      <text x="0" y="40"><tspan class="key">Enfoque:</tspan> <tspan class="val">Aplicaciones Web, E-Commerce &amp; APIs Escalables</tspan></text>
      <text x="0" y="60"><tspan class="key">Stack.Frontend:</tspan> <tspan class="val">html, css, javascript, tailwind, bootstrap</tspan></text>
      <text x="0" y="80"><tspan class="key">Stack.Backend:</tspan> <tspan class="val">php, laravel, python, nodejs, sql</tspan></text>
      <text x="0" y="100"><tspan class="key">Stack.Database:</tspan> <tspan class="val">sql, mysql, postgresql</tspan></text>
      <text x="0" y="120"><tspan class="key">Entorno:</tspan> <tspan class="val">windows, linux, git, github, vscode, postman</tspan></text>
      <text x="0" y="140"><tspan class="key">Ubicacion:</tspan> <tspan class="val">Colombia</tspan> <tspan class="val-accent">[CO]</tspan></text>
      <text x="0" y="160"><tspan class="key">Filosofia:</tspan> <tspan class="val">codigo limpio, sistemas escalables y aprendizaje</tspan></text>
      <text x="0" y="180"><tspan class="key">Contacto.GitHub:</tspan> <tspan class="val">github.com/emanuelca109</tspan></text>
      <text x="0" y="200"><tspan class="key">Contacto.Correo:</tspan> <tspan class="val">emasan1999@gmail.com</tspan></text>
      <text x="0" y="220"><tspan class="key">GitHub.Status:</tspan> <tspan class="val-accent">[ACTIVE &amp; DEVELOPING]</tspan></text>
      <text x="0" y="240"><tspan class="key">GitHub.Lenguajes:</tspan> <tspan class="val">PHP, JavaScript, Python, SQL</tspan></text>
      <text x="0" y="260"><tspan class="key">GitHub.Herramientas:</tspan> <tspan class="val">Linux, Git, VS Code, Postman</tspan></text>
    </g>

    <!-- Color Palette Pills -->
    <g transform="translate(0, 335)">
      <rect x="0" y="0" width="16" height="16" rx="3" fill="#161B22" />
      <rect x="22" y="0" width="16" height="16" rx="3" fill="#00FF41" />
      <rect x="44" y="0" width="16" height="16" rx="3" fill="#58A6FF" />
      <rect x="66" y="0" width="16" height="16" rx="3" fill="#FFA657" />
      <rect x="88" y="0" width="16" height="16" rx="3" fill="#D2A8FF" />
      <rect x="110" y="0" width="16" height="16" rx="3" fill="#39D353" />
      <rect x="132" y="0" width="16" height="16" rx="3" fill="#F0F6FC" />
    </g>
  </g>

  <!-- Bottom Terminal Prompt with Animated Blinking Cursor -->
  <g transform="translate(25, 450)">
    <text x="0" y="0" class="prompt">┌──(emanuelca109@github)-[~]</text>
    <text x="0" y="22" class="prompt">└─$ <tspan fill="#E6EDF3">Construyendo soluciones web y arquitectura sólida</tspan><tspan class="cursor-blink"> █</tspan></text>
  </g>
</svg>
