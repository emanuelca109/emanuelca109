<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c111c" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00FF66" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0" />
    </linearGradient>

    <clipPath id="avatarRounded">
      <rect x="36" y="55" width="170" height="200" rx="16" />
    </clipPath>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes neonPulse {
      0%, 100% { filter: drop-shadow(0 0 3px #00FF66); }
      50% { filter: drop-shadow(0 0 10px #00FF66) drop-shadow(0 0 18px rgba(0,255,102,0.45)); }
    }
    @keyframes avatarGlow {
      0%, 100% { stroke: #00FF66; filter: drop-shadow(0 0 4px rgba(0,255,102,0.4)); }
      50% { stroke: #00E5FF; filter: drop-shadow(0 0 12px rgba(0,229,255,0.7)); }
    }
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { opacity: 0.35; }
      100% { transform: translateY(305px); opacity: 0.1; }
    }
    @keyframes statusBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.92); }
    }

    .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .hero-name { font-family: 'Fira Code', monospace; font-size: 26px; font-weight: 800; fill: #00FF66; animation: neonPulse 3.5s infinite ease-in-out; letter-spacing: 1.5px; }
    .hero-sub { font-family: 'Fira Code', monospace; font-size: 13.5px; fill: #58A6FF; font-weight: 600; letter-spacing: 0.5px; }
    .prompt { fill: #00FF66; font-weight: bold; font-size: 13.5px; }
    .key-prop { fill: #58A6FF; font-weight: 600; font-size: 13px; }
    .val-text { fill: #E6EDF3; font-size: 13px; }
    .val-emerald { fill: #00FF66; font-weight: 600; font-size: 13px; }
    .val-cyan { fill: #79C0FF; font-weight: 600; font-size: 13px; }
    .cursor-blink { animation: blink 1s infinite steps(1); fill: #00FF66; }
    .scan-bar { animation: scanline 5s linear infinite; }
    .avatar-border { animation: avatarGlow 3s infinite ease-in-out; }
    .status-dot { animation: statusBlink 2s infinite ease-in-out; transform-origin: 194px 246px; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="876" height="316" rx="14" fill="url(#bgGrad)" stroke="#30363D" stroke-width="1.5" />

  <!-- Animated Scanline -->
  <line x1="12" y1="10" x2="868" y2="10" stroke="#00FF66" stroke-width="1.5" stroke-opacity="0.3" class="scan-bar" />

  <!-- Window Header Controls -->
  <circle cx="26" cy="22" r="5" fill="#FF5F56" />
  <circle cx="44" cy="22" r="5" fill="#FFBD2E" />
  <circle cx="62" cy="22" r="5" fill="#27C93F" />
  <text x="82" y="26" class="font-mono" fill="#8B949E" font-size="12px">terminal — emanuel@dev-machine: ~</text>

  <!-- Left: Avatar & Status Badge -->
  <g>
    <!-- Border Frame with Glow Animation -->
    <rect x="36" y="55" width="170" height="200" rx="16" fill="#161B22" stroke="#00FF66" stroke-width="2.5" class="avatar-border" />
    <!-- Avatar Image -->
    <image href="https://github.com/emanuelca109.png" x="36" y="55" width="170" height="200" clip-path="url(#avatarRounded)" />

    <!-- Status Pill: Open to Work -->
    <rect x="44" y="265" width="154" height="24" rx="12" fill="#0D1117" stroke="#238636" stroke-width="1" />
    <circle cx="58" cy="277" r="4.5" fill="#00FF66" class="status-dot" />
    <text x="69" y="281" class="font-mono" fill="#00FF66" font-size="10.5px" font-weight="bold">AVAILABLE FOR HIRE</text>
  </g>

  <!-- Right: Identity & Tech Overview -->
  <g transform="translate(236, 60)">
    <!-- Main Title -->
    <text x="0" y="22" class="hero-name">EMANUEL CABRERA</text>
    <text x="0" y="44" class="hero-sub">// FULL-STACK DEVELOPER &amp; SOFTWARE ENGINEER</text>
    
    <!-- Neon Accent Separator Line -->
    <line x1="0" y1="53" x2="600" y2="53" stroke="url(#lineGrad)" stroke-width="2" />

    <!-- Terminal Command Line -->
    <g transform="translate(0, 75)" class="font-mono">
      <text x="0" y="0" class="prompt">┌──(emanuelca109@github)-[~]</text>
      <text x="0" y="18" class="prompt">└─$ <tspan fill="#79C0FF">neofetch</tspan> <tspan fill="#E6EDF3">--developer-specs</tspan></text>
    </g>

    <!-- Key-Value Details -->
    <g transform="translate(0, 118)" class="font-mono">
      <!-- Line 1: Enfoque -->
      <text x="0" y="0">
        <tspan fill="#00FF66">▸</tspan> <tspan class="key-prop">Enfoque      :</tspan> 
        <tspan class="val-text"> Desarrollo Web Full-Stack &amp; Arquitectura de Software</tspan>
      </text>

      <!-- Line 2: Stack Principal -->
      <text x="0" y="22">
        <tspan fill="#00FF66">▸</tspan> <tspan class="key-prop">Stack Central:</tspan> 
        <tspan class="val-emerald">PHP</tspan><tspan fill="#8B949E"> / </tspan>
        <tspan class="val-emerald">Laravel</tspan><tspan fill="#8B949E"> • </tspan>
        <tspan class="val-cyan">JavaScript</tspan><tspan fill="#8B949E"> • </tspan>
        <tspan class="val-text">TailwindCSS &amp; MySQL</tspan>
      </text>

      <!-- Line 3: Proyecto Insignia -->
      <text x="0" y="44">
        <tspan fill="#00FF66">▸</tspan> <tspan class="key-prop">Proyecto Top :</tspan> 
        <tspan class="val-emerald">Coffee.Dat</tspan> 
        <tspan fill="#8B949E">[Plataforma E-Commerce de Caficultura]</tspan>
      </text>

      <!-- Line 4: Ubicación & Filosofía -->
      <text x="0" y="66">
        <tspan fill="#00FF66">▸</tspan> <tspan class="key-prop">Ubicación    :</tspan> 
        <tspan class="val-text">Colombia </tspan><tspan class="val-emerald">[CO 🇨🇴]</tspan>
        <tspan fill="#8B949E"> | </tspan><tspan class="key-prop">Mente:</tspan> 
        <tspan class="val-text"> Código limpio &amp; escalabilidad</tspan>
      </text>
    </g>

    <!-- Color Palette Indicator & Cursor -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="18" height="14" rx="3" fill="#161B22" />
      <rect x="24" y="0" width="18" height="14" rx="3" fill="#00FF66" />
      <rect x="48" y="0" width="18" height="14" rx="3" fill="#00E5FF" />
      <rect x="72" y="0" width="18" height="14" rx="3" fill="#58A6FF" />
      <rect x="96" y="0" width="18" height="14" rx="3" fill="#BC8CFF" />
      <rect x="120" y="0" width="18" height="14" rx="3" fill="#F0F6FC" />

      <text x="150" y="11" class="font-mono" fill="#8B949E" font-size="11.5px">status: <tspan fill="#00FF66" font-weight="bold">ONLINE</tspan><tspan class="cursor-blink"> █</tspan></text>
    </g>
  </g>
</svg>
