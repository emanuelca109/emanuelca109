<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF41" />
      <stop offset="70%" stop-color="#00FF41" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .term-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13.5px; }
    .title-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 16px; font-weight: bold; fill: #00FF41; }
    .key { fill: #58A6FF; font-weight: 600; }
    .val { fill: #E6EDF3; }
    .val-accent { fill: #7EE787; }
    .ascii { fill: #388BFD; font-family: monospace; font-size: 11px; line-height: 1.1; }
    .prompt { fill: #00FF41; font-family: 'Fira Code', monospace; font-size: 13.5px; font-weight: bold; }
    .comment { fill: #7D8590; }
  </style>

  <!-- Card Background -->
